name: Update Petlio Market Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: petlio-market-activity-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Petlio market activity
        run: node scripts/update.mjs

      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- current.json summary.json history; then
            echo "No market activity changes."
            exit 0
          fi
          git config user.name "petlio-market-bot"
          git config user.email "petlio-market-bot@users.noreply.github.com"
          git add current.json summary.json history
          git commit -m "Update Petlio market activity"
          git push
